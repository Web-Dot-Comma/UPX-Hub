<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>UPX Hub | Login</title>
    <meta name="description" content="Página de Login e Cadastro de usuários do site.">
    <link rel="icon" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="login-page">
        <form action="">
            <h1>Login</h1>
            <div class="campos-login">
                <input type="text" placeholder="Usuário" required>
            </div>
            <div class="campos-login">
                <input type="password" placeholder="Senha" required>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">Manter conectado</label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" class="login-botao">Acessar</button>

            <div class="cadastro-form">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>
    </div>

</body>
</html>
